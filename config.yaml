# Configuração da base de dados. Para usar outra base, aponte "path" para o
# seu CSV e ajuste o mapeamento de colunas abaixo.
dataset:
  name: Book-Crossing (Kaggle · ruchi798/bookcrossing-dataset)
  interactions_path: data/bookcrossing/ratings.csv
  items_path: data/bookcrossing/books.csv   # opcional (títulos dos itens); use null se não houver
  sep: ","
  columns:
    user: user
    item: isbn
    rating: rating        # use null se a base só tiver interações (feedback implícito)
    timestamp: null       # a base não tem data; use null se não houver
  items_columns:
    item: isbn
    title: title
    extra: category       # opcional (ex.: gênero/categoria); use null se não houver
    author: author        # opcional
    year: year            # opcional
  rating_scale: [1, 10]   # notas 0 (feedback implícito no Book-Crossing) são descartadas
  relevance_threshold: 8  # nota mínima para considerar um item "relevante"

preprocessing:
  min_user_interactions: 5
  min_item_interactions: 8

model:
  neighbors: 30          # vizinhos considerados na predição
  shrinkage: 10          # penaliza similaridades com poucos co-avaliadores
  popularity_min_votes: 10

evaluation:
  split: random          # "temporal" (avaliações mais recentes) exige coluna de data
  seed: 42
  test_fraction: 0.2     # fração de cada usuário que vai para teste
  k: 10
  min_user_interactions_for_test: 5

storage:
  new_ratings_path: data/user_ratings.csv   # avaliações feitas pela interface
